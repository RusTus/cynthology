# Builds the installer ISO + install tarball and publishes them as a GitHub Release.
# Trigger: push a tag like v0.1.1-alpha   (or run manually from the Actions tab)
name: Release ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.1-alpha) - creates tag v<version>"
        required: true
      skip_e2e:
        description: "Skip the end-to-end tests (emergency fixes only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # a fresh VM installs this commit and is driven through the UI/API first (tests/e2e)
  e2e:
    if: ${{ !inputs.skip_e2e }}
    uses: ./.github/workflows/e2e.yml

  build:
    needs: e2e
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > VERSION

      - name: Tests
        run: |
          sudo apt-get update -q || echo "apt-get update had errors (third-party runner repos) - continuing"
          sudo apt-get install -y -q xorriso
          pip install pytest fastapi psutil httpx qrcode "fido2==1.2.*"
          cd backend && python -m pytest -q tests

      - name: Cache Debian netinst
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: debian-netinst-${{ hashFiles('image/build-iso.sh') }}-${{ github.run_id }}
          restore-keys: debian-netinst-

      - name: Build ISO
        env:
          ISO_OUT_NAME: cynthology-amd64.iso
        run: |
          image/build-iso.sh "${{ steps.v.outputs.version }}"
          git archive --format=tar.gz --prefix=cynthology/ --add-file=VERSION -o dist/cynthology-install.tar.gz HEAD
          cd dist && sha256sum cynthology-install.tar.gz > cynthology-install.tar.gz.sha256
          ls -la

      - name: Sign (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          V="${{ steps.v.outputs.version }}"
          PUB=$(sed -n 's/^CYN_RELEASE_KEY="\(.*\)"$/\1/p' get.sh)
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            # installs that know the key refuse unsigned releases: never publish one by accident
            [ -z "$PUB" ] || { echo "::error::get.sh has a release key but the MINISIGN_SECRET_KEY secret is missing"; exit 1; }
            echo "No signing key configured - release is not signed (see SIGNING.md)"; exit 0
          fi
          sudo apt-get install -y -q minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          for f in cynthology-install.tar.gz cynthology-amd64.iso; do
            minisign -S -s "$RUNNER_TEMP/release.key" -m "dist/$f" -t "cynthology $V $f" </dev/null
          done
          rm -f "$RUNNER_TEMP/release.key"
          if [ -n "$PUB" ]; then   # the key in get.sh must match the one that signed
            minisign -V -P "$PUB" -m dist/cynthology-install.tar.gz
          else
            echo "::warning::release signed, but get.sh has no CYN_RELEASE_KEY yet - installs don't check signatures"
          fi
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          cat > notes.md <<NOTES
          **Cynthology $V** - alpha, for testing only.

          **Install** on a clean, minimal Debian 13 x86-64 system:
          \`wget -qO- https://raw.githubusercontent.com/RusTus/cynthology/main/get.sh | sudo bash\`

          **Already installed?** Control Panel → Update → Update now, or \`sudo cynthology update\`.

          - **cynthology-install.tar.gz** - the same installer for offline/manual use (\`sudo bash install.sh\`)
          - **cynthology-amd64.iso** - optional all-in-one installer (Debian 13 + Cynthology, BIOS + UEFI, needs internet)

          Then open \`https://<box-ip>:5001\` and sign in with your Debian user.
          NOTES
          SIGS=$(ls dist/*.minisig 2>/dev/null || true)
          gh release create "v$V" --target "$GITHUB_SHA" --title "Cynthology $V" --notes-file notes.md \
            dist/cynthology-amd64.iso dist/cynthology-amd64.iso.sha256 \
            dist/cynthology-install.tar.gz dist/cynthology-install.tar.gz.sha256 $SIGS \
          || gh release upload "v$V" --clobber \
            dist/cynthology-amd64.iso dist/cynthology-amd64.iso.sha256 \
            dist/cynthology-install.tar.gz dist/cynthology-install.tar.gz.sha256 $SIGS
