<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cynthology</title>
<link rel="stylesheet" href="/static/css/desktop.css">
<script>
  // Theme: dark by default; "auto" follows the computer. Chosen in Personal settings (per browser).
  (function () {
    let t = "dark";
    try { t = localStorage.getItem("cyn-theme") || "dark"; } catch (e) {}
    if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div id="login" class="login">
  <form id="login-form" class="login-card">
    <div class="logo"><span class="stones"><i></i><i></i><i></i></span> Cynthology</div>
    <div id="login-host" class="muted"></div>
    <div id="login-step1" style="display:contents">
      <input id="login-user" placeholder="Username" autocomplete="username" required>
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <div id="login-step2" class="hidden" style="display:grid;gap:8px">
      <div>Enter the 6-digit code from your authenticator app.</div>
      <input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="9">
      <div class="muted" style="font-size:12px">Lost your phone? Enter one of your backup codes instead (xxxx-xxxx).</div>
    </div>
    <button type="submit" data-t="Sign in">Sign in</button>
    <div id="login-err" class="err"></div>
  </form>
</div>

<div id="desktop" class="desktop hidden">
  <header class="taskbar">
    <button id="menu-btn" class="tb-btn" title="Main menu"></button>
    <div id="tasks" class="tasks"></div>
    <div class="tb-right">
      <button id="usb-btn" class="tb-btn hidden" title="External devices"></button>
      <span id="clock"></span>
      <button id="user-btn" class="tb-btn"></button>
    </div>
  </header>
  <div id="menu" class="menu hidden"></div>
  <div id="usb-menu" class="menu menu-right hidden" style="min-width:260px"></div>
  <div id="user-menu" class="menu menu-right hidden">
    <button data-act="personal" data-t="Personal settings">Personal settings</button>
    <button data-act="reboot" data-t="Restart">Restart</button>
    <button data-act="shutdown" data-t="Shut down">Shut down</button>
    <button data-act="logout" data-t="Sign out">Sign out</button>
  </div>
  <div id="icons" class="icons"></div>
  <aside id="widgets" class="widgets"></aside>
  <div id="windows"></div>
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/icons.js"></script>
<script src="/static/js/wm.js"></script>
<script src="/static/js/apps/storage.js"></script>
<script src="/static/js/apps/control.js"></script>
<script src="/static/js/apps/monitor.js"></script>
<script src="/static/js/apps/appcenter.js"></script>
<script src="/static/js/apps/filestation.js"></script>
<script src="/static/js/apps/snapshots.js"></script>
<script src="/static/js/apps/backup.js"></script>
<script src="/static/js/apps/containers.js"></script>
<script src="/static/js/apps/webstation.js"></script>
<script src="/static/js/apps/san.js"></script>
<script src="/static/js/apps/logcenter.js"></script>
<script src="/static/js/setup.js"></script>
<script src="/static/js/apps/personal.js"></script>
<script src="/static/js/desktop.js"></script>
</body>
</html>
