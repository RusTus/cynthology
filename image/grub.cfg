set timeout=10
set default=0
insmod all_video
insmod gfxterm
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry 'Install Cynthology' {
    linux    /install.amd/vmlinuz vga=788 file=/cdrom/cynthology/image/preseed.cfg --- quiet
    initrd   /install.amd/initrd.gz
}
menuentry 'Install Cynthology (graphical installer)' {
    linux    /install.amd/vmlinuz vga=788 file=/cdrom/cynthology/image/preseed.cfg --- quiet
    initrd   /install.amd/gtk/initrd.gz
}
menuentry 'Install Cynthology (expert mode)' {
    linux    /install.amd/vmlinuz priority=low file=/cdrom/cynthology/image/preseed.cfg ---
    initrd   /install.amd/initrd.gz
}
