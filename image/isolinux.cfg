path
default vesamenu.c32
prompt 0
timeout 100
menu title CairnOS installer
label cairnos
	menu label ^Install CairnOS
	menu default
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/initrd.gz file=/cdrom/cairnos/image/preseed.cfg --- quiet
label cairnos-gtk
	menu label Install CairnOS (^graphical installer)
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz file=/cdrom/cairnos/image/preseed.cfg --- quiet
label cairnos-expert
	menu label Install CairnOS (^expert mode)
	kernel /install.amd/vmlinuz
	append priority=low initrd=/install.amd/initrd.gz file=/cdrom/cairnos/image/preseed.cfg ---
