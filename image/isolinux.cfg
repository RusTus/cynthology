path
default vesamenu.c32
prompt 0
timeout 100
menu title Cynthology installer
label cynthology
	menu label ^Install Cynthology
	menu default
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/initrd.gz file=/cdrom/cynthology/image/preseed.cfg --- quiet
label cynthology-gtk
	menu label Install Cynthology (^graphical installer)
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz file=/cdrom/cynthology/image/preseed.cfg --- quiet
label cynthology-expert
	menu label Install Cynthology (^expert mode)
	kernel /install.amd/vmlinuz
	append priority=low initrd=/install.amd/initrd.gz file=/cdrom/cynthology/image/preseed.cfg ---
