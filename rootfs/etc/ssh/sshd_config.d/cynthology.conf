# Managed by Cynthology. Ordinary NAS users may sign in over SSH/SFTP, but not use the NAS
# as a network relay (port forwarding/tunnels can reach services that only listen locally).
Match Group users,!cynthology-admin
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
